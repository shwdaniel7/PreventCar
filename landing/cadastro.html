<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — PreventCar</title>
  <meta name="description" content="Crie sua conta no PreventCar — a maneira inteligente de cuidar de seu veículo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563EB'/%3E%3Cpath d='M14 40h3c0-5 1.6-8 5-8h20c3.4 0 5 3 5 8h3a2 2 0 0 1 2 2v3h-4M16 45h6M42 45h6' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='45' r='2.4' fill='white'/%3E%3Ccircle cx='44' cy='45' r='2.4' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link href="assets/css/login.css" rel="stylesheet">
</head>
<body>

  <div class="row g-0 min-vh-100">

    <div class="col-12 col-lg-6 login-banner d-none d-lg-flex flex-column">
      <div class="position-relative">
        <h1 class="banner-title mb-0">PreventCar</h1>
        <p class="banner-tagline mt-3 mb-0">A maneira inteligente de cuidar de seu veículo</p>
      </div>

      <div class="mt-4 w-100">
        <div class="icon-arc" aria-hidden="true">
          <span class="arc-tile">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </span>
          <span class="arc-tile" style="margin-top: 18px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </span>
          <span class="arc-tile" style="margin-top: 34px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <span class="arc-tile" style="margin-top: 18px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          </span>
          <span class="arc-tile">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          </span>
        </div>

        <svg class="car-art" viewBox="0 0 280 150" role="img" aria-label="Ilustração de um carro azul">
          <defs>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#93C5FD"/>
              <stop offset="55%" stop-color="#60A5FA"/>
              <stop offset="100%" stop-color="#3B82F6"/>
            </linearGradient>
            <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
              <stop offset="100%" stop-color="#172554"/>
            </linearGradient>
          </defs>

          <ellipse cx="140" cy="130" rx="122" ry="9" fill="#000" opacity="0.3"/>

          <path fill="url(#bodyGrad)" d="M16 106 L30 106 C32 92 40 85 50 80 L62 72 C69 67 75 62 83 58 C90 54 98 52 106 52 L138 52 C146 52 154 54 160 58 C165 61 169 66 173 72 L180 85 C188 89 202 91 218 92 C230 93 244 95 252 100 C258 103 260 106 259 109 L22 109 C16 109 14 106 15 102 Z"/>

          <g fill="url(#glassGrad)">
            <path d="M84 60 C86 56 90 53 96 52 L134 52 L134 73 L84 73 Z"/>
            <path d="M140 54 L158 54 C162 56 166 61 170 69 L156 73 L140 73 Z"/>
          </g>

          <rect x="133" y="52" width="5" height="21" fill="#2563EB"/>
          <path d="M160 67 L166 64 C170 64 172 67 171 70 L162 72 Z" fill="#172554"/>
          <rect x="146" y="89" width="14" height="3.5" rx="1.75" fill="#172554"/>
          <path d="M245 96 L261 96 L260 103 L245 103 Z" fill="#FDE047"/>
          <rect x="18" y="95" width="12" height="6" rx="3" fill="#F87171"/>

          <path d="M40 101 C42 89 54 81 66 73 L176 61" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.2" stroke-linecap="round"/>

          <circle cx="74" cy="104" r="20" fill="#0B1220" stroke="#1E3A8A" stroke-width="3"/>
          <circle cx="74" cy="104" r="7" fill="#94A3B8"/>
          <circle cx="196" cy="104" r="20" fill="#0B1220" stroke="#1E3A8A" stroke-width="3"/>
          <circle cx="196" cy="104" r="7" fill="#94A3B8"/>
        </svg>
      </div>
    </div>

    <div class="col-12 col-lg-6 login-panel d-flex flex-column">
      <div class="login-card">
        <div class="text-center mb-3">
          <span class="login-logo" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          </span>
          <h2 class="login-title mb-0">PreventCar</h2>
          <p class="login-welcome mb-0">Crie sua conta</p>
          <p class="login-message mb-0">Preencha os dados abaixo para começar</p>
        </div>

        <form id="cadastroForm" novalidate>
          <div class="mb-3">
            <label for="nomeCompleto" class="form-label">Nome Completo</label>
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              </span>
              <input id="nomeCompleto" type="text" name="nome" class="form-control" autocomplete="name" required placeholder="Digite seu nome completo">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              </span>
              <input id="email" type="email" name="email" class="form-control" autocomplete="email" required placeholder="Digite seu email">
            </div>
          </div>

          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="field">
              <span class="field-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </span>
              <input id="senha" type="password" name="senha" class="form-control" autocomplete="new-password" required minlength="6" placeholder="Digite sua senha" style="padding-right: 48px;">
              <button type="button" id="toggleSenha" class="field-toggle" aria-label="Mostrar ou ocultar senha" aria-pressed="false">
                <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="d-none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </div>

          <div class="form-check mb-3">
            <input id="aceite" type="checkbox" class="form-check-input" checked required>
            <label for="aceite" class="form-check-label">
              Eu aceito os
              <a href="#" class="link-soft">Termos de Serviço</a>
              e
              <a href="#" class="link-soft">Privacidade</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-enter w-100 fw-semibold text-uppercase">
            Realizar Cadastro
          </button>
        </form>

        <p class="login-footer text-center mt-3 mb-0">
          Já possui conta?
          <a href="login.html" class="link-soft">Faça login</a>
        </p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    var toggleBtn = document.getElementById("toggleSenha");
    var senhaInput = document.getElementById("senha");
    var eyeOpen = document.getElementById("eyeOpen");
    var eyeClosed = document.getElementById("eyeClosed");

    toggleBtn.addEventListener("click", function () {
      var isPassword = senhaInput.type === "password";
      senhaInput.type = isPassword ? "text" : "password";
      toggleBtn.setAttribute("aria-pressed", String(!isPassword));
      eyeOpen.classList.toggle("d-none", !isPassword);
      eyeClosed.classList.toggle("d-none", isPassword);
    });

    document.getElementById("cadastroForm").addEventListener("submit", function (event) {
      event.preventDefault();
      var nome = document.getElementById("nomeCompleto");
      var email = document.getElementById("email");
      if (!nome.value || !email.value || !senhaInput.value) {
        nome.focus();
      }
    });
  </script>
</body>
</html>
